name: news_app
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  melos: ^6.3.3
  logger: ^2.6.2
  cupertino_icons: ^1.0.6
